name: "CI/CD"

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    branches: [ main, dev ]


jobs:
  verify:
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'dev'))
    uses: igor-krechetov/hsm-github-workflows/.github/workflows/verify.yml@main

  # -------------------------------------------------------- 
  build:
    needs: verify
    uses: igor-krechetov/hsm-github-workflows/.github/workflows/build.yml@main
    if: >
      always() &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    with:
      build_type: Release
      platforms: "posix,windows,platformio,arduinoide,freertos"
      install_qt: 'ON'
      install_glibmm: 'ON'
      build_tests: 'ON'
      package: false

  # --------------------------------------------------------
  # Build and test the key combinations of build options (thread-safety, structure validation,
  # debugging, dispatchers) listed in scripts/build/posix/matrix.yaml, plus checks that invalid
  # combinations are rejected. One job per matrix group; every configuration of a group is built
  # in its own directory by scripts/build/posix/matrix.py, a failure does not stop the remaining
  # configurations, and a summary table is added to the job summary.
  # Run locally with: just test_matrix [--group <name>] [--only <name>]
  build_matrix:
    name: "Build matrix (${{ matrix.group }})"
    needs: verify
    if: always() && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    # Same image as the build job
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # needs GLib, Glibmm and Qt
          - group: dispatchers
            install_dispatcher_deps: true
          - group: core-std
            install_dispatcher_deps: false
          - group: core-singlethread
            install_dispatcher_deps: false
          - group: misc
            install_dispatcher_deps: false
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Install GLib/Glibmm
        if: ${{ matrix.install_dispatcher_deps }}
        uses: awalsh128/cache-apt-pkgs-action@v1.6.0
        with:
          packages: libglibmm-2.4-dev
          version: 1.0

      - name: Install Qt
        if: ${{ matrix.install_dispatcher_deps }}
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: ''
          cache: 'true'
          cache-key-prefix: 'install-qt-action-linux'
          set-env: 'true'

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-matrix-${{ matrix.group }}

      # Installed right before use so it lands in the python3 that is active after the Qt step
      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml

      - name: Build and test (${{ matrix.group }})
        run: python3 ./scripts/build/posix/matrix.py --group "${{ matrix.group }}"

  # --------------------------------------------------------
  test:
    needs: build
    if: always() && (needs.build.result == 'success')
    uses: igor-krechetov/hsm-github-workflows/.github/workflows/test.yml@main
    with:
      platform: 'ubuntu'
      install_qt: 'ON'
      install_glibmm: 'ON'

  # --------------------------------------------------------
  # Validate TRLC requirements, render the requirements HTML + LOBSTER coverage
  # report, and upload them as a `pages-requirements` contribution artifact.
  # Runs after test so it can reuse the test artifact; the actual Pages deploy
  # is owned solely by the `pages` job below.
  requirements:
    needs: test
    if: always() && (needs.test.result == 'success')
    uses: igor-krechetov/hsm-github-workflows/.github/workflows/requirements.yml@main
    with:
      generate_coverage: 'ON'

  # --------------------------------------------------------
  sast:
    needs: build
    if: always() && (needs.build.result == 'success')
    uses: igor-krechetov/hsm-github-workflows/.github/workflows/sast.yml@main
    with:
      coverity_project: igor-krechetov/hsmcpp
      coverity_project_url: igor-krechetov%2Fhsmcpp
    secrets:
      COVERITY_TOKEN: ${{ secrets.COVERITY_TOKEN }}
      COVERITY_EMAIL: ${{ secrets.COVERITY_EMAIL }}


  # --------------------------------------------------------
  autotag:
    needs: [verify, build, build_matrix, requirements, sast]
    if: >
      (github.event_name == 'push' && github.ref_name == 'main') &&
      needs.build.result == 'success' &&
      needs.test.result == 'success' &&
      needs.sast.result == 'success'
    uses: igor-krechetov/hsm-github-workflows/.github/workflows/autotag.yml@main
    with:
      commit_version: ${{ needs.verify.outputs.commit_version }}
      commit_action: ${{ needs.verify.outputs.commit_action }}
      commit_sha: ${{ github.sha }}
    secrets:
      BOT_GPG_PRIVATE_KEY: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
      BOT_GPG_PASSPHRASE: ${{ secrets.BOT_GPG_PASSPHRASE }}

  # --------------------------------------------------------
  update_documentation:
    needs: [verify, autotag]
    if: >
      (github.event_name == 'push' && github.ref_name == 'main') &&
      needs.verify.result == 'success' &&
      needs.autotag.result == 'success'
    uses: igor-krechetov/hsm-github-workflows/.github/workflows/update-docs.yml@main
    with:
      library_name: hsmcpp
      commit_version: ${{ needs.verify.outputs.commit_version }}
    secrets:
      HSMCPP_BOT_TOKEN: ${{ secrets.HSMCPP_BOT_TOKEN }}
      BOT_GPG_PRIVATE_KEY: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
      BOT_GPG_PASSPHRASE: ${{ secrets.BOT_GPG_PASSPHRASE }}

  # --------------------------------------------------------
  # Single owner of the GitHub Pages deployment: merges every `pages-*`
  # contribution (test badges + requirements + coverage) into one site and
  # deploys it. Only on main.
  pages:
    needs: autotag
    if: >
      (github.event_name == 'push' && github.ref_name == 'main') &&
      needs.test.result == 'success' &&
      needs.requirements.result == 'success'
    uses: igor-krechetov/hsm-github-workflows/.github/workflows/deploy-pages.yml@main
    with:
      site_title: "hsmcpp"

  # --------------------------------------------------------
  release:
    needs: [verify, update_documentation]
    if: >
      (github.event_name == 'push' && github.ref_name == 'main') &&
      needs.verify.outputs.commit_action == 'r' &&
      needs.verify.result == 'success' &&
      needs.update_documentation.result == 'success'
    uses: igor-krechetov/hsm-github-workflows/.github/workflows/release.yml@main
    with:
      commit_sha: ${{ github.sha }}
      tag_version: ${{ needs.verify.outputs.commit_version }}
      # dont upload any binaries
      builds: ""
      # The reusable workflow generates the release body from CHANGELOG.md
      # (header + changelog block). hsmcpp has no binary footer, so no
      # release_description is supplied.

  # --------------------------------------------------------
  deploy:
    needs: [verify, release]
    if: >
      (github.event_name == 'push' && github.ref_name == 'main') &&
      needs.release.result == 'success'
    uses: igor-krechetov/hsm-github-workflows/.github/workflows/deploy.yml@main
    with:
      deploy_target: "platformio,arduinoide"
      commit_sha: ${{ github.sha }}
      commit_version: ${{ needs.verify.outputs.commit_version }}
      target_repo: igor-krechetov/hsmcpp
      platformio_target_branch: platformio_library
      arduinoide_target_repo: igor-krechetov/hsmcpp-arduinoide
    secrets:
      HSMCPP_BOT_TOKEN: ${{ secrets.HSMCPP_BOT_TOKEN }}
      BOT_GPG_PRIVATE_KEY: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
      BOT_GPG_PASSPHRASE: ${{ secrets.BOT_GPG_PASSPHRASE }}
      PLATFORMIO_TOKEN: ${{ secrets.PLATFORMIO_TOKEN }}


