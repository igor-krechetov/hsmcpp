// lobster-trlc configuration: map the hsmcpp TRLC model onto LOBSTER items.
//
// Each block names a record type from requirements/model/hsmcpp.rsl and tells
// lobster-trlc which field carries the requirement text and which fields are
// upstream trace links (tags). A type that appears here is traced; one that
// does not is ignored.

HSMCPP.System_Requirement {
    description = description
}

HSMCPP.Software_Requirement {
    description = description
    tags = parent          // SW requirement traces up to its System_Requirement
}
