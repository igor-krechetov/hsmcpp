# LOBSTER tracing policy for hsmcpp (LOBSTER 1.0.6).
#
# Traceability chain:
#   System Requirements -> Software Requirements -> { Code, Unit Tests }
#
# In LOBSTER, "A trace to B" points to the UPSTREAM item that A refines/verifies:
#   - Software Requirements trace up to System Requirements (TRLC `parent`).
#   - Code and Unit Tests trace up to Software Requirements (source/test tags).
#
# 1.0.6 removed the "with kind" source filter, so System and Software
# requirements are emitted into SEPARATE .lobster files (sys.lobster /
# sw.lobster) by the req_coverage pipeline instead of one reqs.lobster split
# by item kind.

requirements "System Requirements" {
  source: "sys.lobster";
}

requirements "Software Requirements" {
  source: "sw.lobster";
  trace to: "System Requirements";
}

implementation "Code" {
  source: "code.lobster";
  trace to: "Software Requirements";
}

activity "Unit Tests" {
  source: "tests.lobster";
  trace to: "Software Requirements";
}
